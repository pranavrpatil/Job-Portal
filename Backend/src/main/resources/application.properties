spring.application.name=Jobhook
spring.data.mongodb.auto-index-creation = true
spring.data.mongodb.uri=mongodb://localhost:27017/jobportal1
spring.config.import=optional:file:Backend/.env[.properties]

#Email service properties
spring.mail.host =${EMAIL_HOST}
spring.mail.port = ${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#User service messages
USER_FOUND = User has already registered with the email id
NOT_FOUND = User is not registered with the email id
INVALID_CREDENTIALS = Invalid password or email
OTP_NOT_FOUND = OTP is expired
INVALID_OTP = OTP must be 6 digits
INCORRECT_OTP = OTP is incorrect.
INCORRECT_OLD_PASSWORD= Incorrect old password.
INVALID_PASSWORD_PATTERN=Password must be 8-15 characters long and contain at least one uppercase letter, one lowercase letter, one number, and one special character.